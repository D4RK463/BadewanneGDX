name: Building different Versions

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build Linux Version
        run: ./gradlew packageLinuxX64

      - name: Build Windows Version
        run: ./gradlew packageWinX64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lwjgl3/build/construo/dist/Wanne-linuxX64.zip
            lwjgl3/build/construo/dist/Wanne-winX64.zip
