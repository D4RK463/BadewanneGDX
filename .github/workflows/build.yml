name: Building different Versions and creating a release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build Linux Version
        run: ./gradlew packageLinuxX64

      - name: Build Windows Version
        run: ./gradlew packageWinX64

      - uses: actions/checkout@master
      - name: Retrieve Version
        run: |
          echo "::set-output name=VERSION_NAME::$(${{github.workspace}}/gradlew -q printVersionName)"
        id: wanne_version

      - name: Get version
        run: |
          echo "version_name=${{steps.wanne_version.outputs.VERSION_NAME}}" >> $GITHUB_ENV

#      - name: Push tag
#        uses: laputansoft/github-tag-action@v4.6
#        with:
#          github_token: ${{ secrets.GITHUB_TOKEN }}
#          tag: ${{env.version_name}}

      - name: Tag and Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "lwjgl3/build/construo/dist/*.zip"
          tag: ${{env.version_name}}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifactErrorsFailBuild: true
          allowUpdates: true
