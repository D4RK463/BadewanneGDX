name: Building and release on main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_release:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build Linux Version
        run: ./gradlew packageLinuxX64

      - name: Build Windows Version
        run: ./gradlew packageWinX64

      - name: Build MacX64 Version
        run: ./gradlew packageMacX64

      - name: Build Mac M1 Version
        run: ./gradlew packageMacM1

      - name: Build Unsigned Apk Version
        run: ./gradlew android:assembleRelease

      - name: Sign Apk
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Signed app bundle
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Retrieve Version
        run: |
          echo "VERSION_NAME::$(${{github.workspace}}/gradlew -q printVersionName)" >> $GITHUB_OUTPUT
        id: wanne_version

      - name: Get version
        run: |
          echo "version_name=${{steps.wanne_version.outputs.VERSION_NAME}}" >> $GITHUB_ENV

      - name: Tag and Release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{github.workspace}}/lwjgl3/build/construo/dist/*.zip, ${{github.workspace}}/android/build/release/signed/*.apk"
          tag: ${{env.version_name}}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          generateReleaseNotes: true
